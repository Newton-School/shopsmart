name: Full-Stack CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Phase 1 - Testing (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [client, server]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Run Unit and Integration Tests
        working-directory: ${{ matrix.app }}
        env:
          CI: true
        run: npm run test:report

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.app }}
          path: ${{ matrix.app }}/test-report.json

  terraform:
    name: Phase 2 - Infrastructure Provisioning
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create Terraform State Bucket (if not exists)
        run: |
          aws s3api create-bucket \
            --bucket shopsmart-tf-state-2026 \
            --region ${{ secrets.AWS_REGION }} 2>/dev/null || true
          aws s3api put-bucket-versioning \
            --bucket shopsmart-tf-state-2026 \
            --versioning-configuration Status=Enabled 2>/dev/null || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Import Existing Resources (if any)
        working-directory: terraform
        run: |
          REGION=${{ secrets.AWS_REGION }}
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          terraform import aws_s3_bucket.artifacts shopsmart-artifacts-2026-unique 2>/dev/null || true
          terraform import aws_ecr_repository.backend shopsmart-backend 2>/dev/null || true
          terraform import aws_ecr_repository.frontend shopsmart-frontend 2>/dev/null || true
          terraform import aws_cloudwatch_log_group.backend /ecs/shopsmart-backend 2>/dev/null || true
          terraform import aws_cloudwatch_log_group.frontend /ecs/shopsmart-frontend 2>/dev/null || true

          ALB_ARN=$(aws elbv2 describe-load-balancers --names shopsmart-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null) || true
          [ "$ALB_ARN" != "None" ] && [ -n "$ALB_ARN" ] && terraform import aws_lb.main $ALB_ARN 2>/dev/null || true

          BACKEND_TG_ARN=$(aws elbv2 describe-target-groups --names shopsmart-backend-tg --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null) || true
          [ "$BACKEND_TG_ARN" != "None" ] && [ -n "$BACKEND_TG_ARN" ] && terraform import aws_lb_target_group.backend $BACKEND_TG_ARN 2>/dev/null || true

          FRONTEND_TG_ARN=$(aws elbv2 describe-target-groups --names shopsmart-frontend-tg --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null) || true
          [ "$FRONTEND_TG_ARN" != "None" ] && [ -n "$FRONTEND_TG_ARN" ] && terraform import aws_lb_target_group.frontend $FRONTEND_TG_ARN 2>/dev/null || true

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

  build-and-push:
    name: Phase 3 - Container Build & ECR Push
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: shopsmart-backend
          IMAGE_TAG: ${{ github.sha }}
        working-directory: server
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
      - name: Build and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: shopsmart-frontend
          IMAGE_TAG: ${{ github.sha }}
        working-directory: client
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    name: Phase 3 - Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Backend Service
        run: |
          aws ecs update-service --cluster shopsmart-cluster --service shopsmart-backend-service --force-new-deployment

      - name: Deploy Frontend Service
        run: |
          aws ecs update-service --cluster shopsmart-cluster --service shopsmart-frontend-service --force-new-deployment
